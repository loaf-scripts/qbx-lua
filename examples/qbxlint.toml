# Every key is optional. Place this file at the repository root.

# Extra glob patterns to skip, relative to this file.
exclude = ["web/**", "**/vendor/**"]

# Gitignore-style patterns for code that is analyzed but never reported, relative to this file.
ignore_diagnostics = ['\[standalone\]/']

# Globals that exist at runtime but cannot be discovered from fxmanifest.lua.
globals = []

# Locals and arguments starting with this prefix are never reported as unused.
ignore_unused_prefix = "_"

# Treat every ---@class as (strict) unless it is marked (loose): setting a field it does not declare
# is reported as undeclared-field. Classes in ignore_diagnostics paths are not affected.
strict_classes = false

# Report what TypeScript's strict mode does beyond lua-language-server, such as `n + 1` for a
# `number?`. Overrides can set it per folder. Without it, the editor's setting decides.
strict = false

# Files resources run without an fxmanifest.lua entry, for example through load(LoadResourceFile(...)).
# Put them in an [[overrides]] entry instead to limit them to some resources.
[imports]
shared = []
client = []
server = []

[rules]
# Levels: "off", "hint", "info", "warning", "error". Run `qbx-lint --list-rules` for all codes.
"unused-argument" = "off"
"fivem/citizen-prefix" = "warning"
"qbox/prefer-cache" = "info"

[[overrides]]
files = ["**/tests/**", "**/*.spec.lua"]
rules = { "undefined-global" = "off" }

# The side of files a loader runs without an fxmanifest.lua entry: "client", "server" or "shared".
# A manifest entry always wins, and sides are never guessed from folder names.
[[overrides]]
files = ["client/**"]
side = "client"

[format]
indent_width = 4
use_tabs = false
line_width = 120
quote_style = "preserve"
